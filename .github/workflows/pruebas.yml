name: Flujo de trabajo para ejecutar los test

on:
  workflow_dispatch:
  push:
    branches: [V.0.2]
  pull_request:
    branches: [V.0.2]
  schedule:
    - cron: '1 23 * * 0-4'

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      GITHUB_LOGIN: ${{ github.actor }}
      GITHUB_PACKAGES: ${{ secrets.GHTOKEN }}
      GITHUB_OAUTH: ${{ secrets.GHTOKEN }}
    steps:
      - name: Clonando el repositorio y estableciendo el espacio de trabajo
        uses: actions/checkout@v3

      - name: Se configura Java para el job de construcción
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Construyendo el artefacto
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Se publica el artefacto
        run: |
          chmod +x gradlew
          ./gradlew publish

  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Clonando el repositorio y estableciendo el espacio de trabajo
        uses: actions/checkout@v3

      - name: Descargar artefactos generados
        uses: actions/download-artifact@v3
        with:
          name: us.mitfs.samples.a4i

      - name: Configurando java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Ejecutando pruebas
        run: |
          chmod +x gradlew
          ./gradlew test
